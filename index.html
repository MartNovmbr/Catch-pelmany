<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dahlenburgs' Story — Story + Visa Quest</title>
<style>
:root{
  --bg:#1a1615; --paper:#fbf3e3; --paper2:#fff9ef; --ink:#6e4226; --wood1:#82512d; --wood2:#5d3823;
  --gold:#f6c661; --green:#5ea66d; --red:#c14b4b; --shadow:0 10px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#1f1713,#2b241f);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;min-height:100vh;display:grid;place-items:center;padding:10px}
#app{width:min(100%,470px);display:flex;flex-direction:column;gap:10px}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
#storyView .sceneFrame{position:relative;background:#e9dcc8;aspect-ratio:941/1672}
#storyImg{width:100%;height:100%;object-fit:cover;display:block}
#authorBar{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fdf5e8,#f6ecd8);color:var(--ink);padding:12px 14px 12px 16px;border-top:1px solid rgba(0,0,0,.08)}
#authorTextWrap{flex:1}
#authorLabel{font-size:11px;font-weight:800;letter-spacing:.8px;opacity:.65;text-transform:uppercase;margin-bottom:3px}
#authorText{font-size:14px;line-height:1.35;font-weight:700;min-height:38px}
.arrowBtn,.mainBtn,.smallBtn{appearance:none;border:none;cursor:pointer}
.arrowBtn{width:44px;height:44px;border-radius:50%;flex:0 0 44px;background:linear-gradient(180deg,#84bf6f,#4f8d58);color:#fff;font-size:28px;font-weight:900;box-shadow:var(--shadow)}
.mainBtn{padding:12px 16px;border-radius:14px;background:linear-gradient(180deg,#ffd56b,#f2b142);color:#5d3619;font-size:17px;font-weight:900;box-shadow:var(--shadow)}
.smallBtn{padding:8px 10px;border-radius:10px;background:linear-gradient(180deg,#7b4c2b,#5c3723);color:#fff;font-size:13px;font-weight:700}
#topBar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#7a4c2d,#5d3823)}
#topBar h1{margin:0;font-size:18px;line-height:1;color:#ffe6b7}
#progressText{font-size:12px;font-weight:800;color:#fff1cf}
#visaView{display:none}
#roundStage{padding:14px;background:linear-gradient(180deg,#fffaf1,#f7eedf);color:var(--ink)}
#roundTitle{font-size:20px;font-weight:900;margin:0 0 4px}
#roundSubtitle{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#8f6a4b;font-weight:800;margin:0 0 14px}
#promptBox{background:linear-gradient(180deg,#81502e,#5d3823);border-radius:16px;padding:14px 16px;text-align:center;box-shadow:var(--shadow);color:#fff7ea;margin-bottom:14px}
#promptRu{font-size:26px;font-weight:900;line-height:1.05}
#promptEn{font-size:14px;font-weight:800;opacity:.9;margin-top:6px}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:linear-gradient(180deg,#fffdf9,#efe4d2);border-radius:18px;padding:12px;border:3px solid transparent;box-shadow:0 8px 18px rgba(54,31,17,.12);min-height:158px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#6d4428;text-align:center;cursor:pointer;transition:transform .12s ease,border-color .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-1px)} .card:active{transform:translateY(1px)}
.card.correct{border-color:#67b66e;background:linear-gradient(180deg,#f9fff7,#e6f7e7)}
.card.wrong{border-color:#d96a6a;background:linear-gradient(180deg,#fff7f7,#f8e0e0)}
.illu{font-size:54px;line-height:1;min-height:58px;display:flex;align-items:center;justify-content:center}
.cardTitle{font-size:13px;font-weight:800;line-height:1.2}
#feedback{min-height:20px;padding-top:12px;text-align:center;font-size:14px;font-weight:800;color:#8b5d37}
#roundDots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#d6c1aa;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.dot.done{background:#6ab571}.dot.current{background:#f0b741}
#mapView{display:none}
.mapWrap{position:relative;aspect-ratio:941/1672;background-image:url('assets/map_base_reconstructed.png');background-size:100% 100%;background-repeat:no-repeat}
.mapWrap > img{position:absolute}
.board{left:26.04%;top:.84%;width:48.03%}
.level{width:11.26%;transform:translate(-50%,-50%)}
.knightSprite{position:absolute;width:15%;pointer-events:none;z-index:9;filter:drop-shadow(0 3px 2px #0006)}
.coupleSprite{position:absolute;width:24%;pointer-events:none;z-index:9;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 2px #0006)}
#mapBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(180deg,#fdf5e8,#f6ecd8);color:var(--ink)}
#mapStatus{font-size:14px;font-weight:800;line-height:1.35;flex:1}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#e7d4b5;color:#7a4f2f;margin-bottom:6px}
[hidden]{display:none !important}
#miniIntro{display:none;padding:20px;background:linear-gradient(180deg,#fffaf1,#f8edd8);color:var(--ink);text-align:center}
#miniIntro h2{margin:0 0 6px;font-size:28px;color:#8a562f} #miniIntro p{margin:10px 0 16px;line-height:1.45;font-weight:600}
@media (max-width:420px){#cards{grid-template-columns:1fr 1fr;} .card:last-child:nth-child(odd){grid-column:1 / -1; max-width:180px; justify-self:center;} .illu{font-size:48px;} }
</style>
</head>
<body>
<div id="app">
  <section id="storyView" class="panel">
    <div class="sceneFrame"><img id="storyImg" src="assets/scene1.png" alt="Story scene"></div>
    <div id="authorBar">
      <div id="authorTextWrap">
        <div id="authorLabel">Narrator</div>
        <div id="authorText"></div>
      </div>
      <button id="storyNext" class="arrowBtn" aria-label="Next scene">›</button>
    </div>
  </section>

  <section id="miniIntro" class="panel">
    <div id="topBar"><h1>Level 1 • Visa Quest</h1><div id="progressText">5 rounds</div></div>
    <div style="padding:18px">
      <h2>Visa Quest</h2>
      <p>Choose the correct picture for each Russian word. Finish all 5 rounds to complete Level 1 and unlock Level 2.</p>
      <button id="startVisa" class="mainBtn">Start Visa Quest</button>
    </div>
  </section>

  <section id="visaView" class="panel">
    <div id="topBar"><h1>Level 1 • Visa Quest</h1><div id="progressText"></div></div>
    <div id="roundStage">
      <div id="roundTitle"></div>
      <div id="roundSubtitle">Tap the correct picture</div>
      <div id="promptBox"><div id="promptRu"></div><div id="promptEn"></div></div>
      <div id="cards"></div>
      <div id="feedback"></div>
      <div id="roundDots"></div>
    </div>
  </section>

  <section id="mapView" class="panel">
    <div class="mapWrap" id="map">
      <img class="board" alt="Dahlenburgs' story title" src="assets/title_board.png">
      <img id="knight-sprite" class="knightSprite" src="assets/knight_idle.png" hidden>
      <img id="final-couple" class="coupleSprite" src="assets/final_couple.png" hidden>
    </div>
    <div id="mapBottom">
      <div style="flex:1">
        <div class="badge">Map update</div>
        <div id="mapStatus">Level 1 completed. Level 2 unlocked.</div>
      </div>
      <button id="replayVisa" class="smallBtn">Play again</button>
    </div>
  </section>
</div>
<script>
const scenes = [
  {img:'assets/scene1.png', author:"This is Clinton. One day, between work tasks, he decided to meet someone new..."},
  {img:'assets/scene2.png', author:"He saw a beautiful girl from Russia and instantly fell for her..."},
  {img:'assets/scene3.png', author:"Since then, they stayed in touch all the time, and the heroic journey to Moscow began..."}
];
let sceneIndex = 0;
const storyView=document.getElementById('storyView');
const miniIntro=document.getElementById('miniIntro');
const visaView=document.getElementById('visaView');
const mapView=document.getElementById('mapView');
const storyImg=document.getElementById('storyImg');
const authorText=document.getElementById('authorText');
const storyNext=document.getElementById('storyNext');
function renderScene(){ storyImg.src=scenes[sceneIndex].img; authorText.textContent=scenes[sceneIndex].author; storyNext.textContent = sceneIndex===scenes.length-1 ? '▶' : '›'; }
renderScene();
storyNext.addEventListener('click', ()=>{ if(sceneIndex < scenes.length-1){ sceneIndex++; renderScene(); } else { storyView.style.display='none'; miniIntro.style.display='block'; } });

const rounds = [
  {ru:'Бабушка', en:'babushka', correct:0, options:[
    {emoji:'👵', label:'one grandmother'},
    {emoji:'👵👵', label:'two grandmothers'},
    {emoji:'👴', label:'grandfather'}]},
  {ru:'Кот', en:'kot', correct:0, options:[
    {emoji:'🐱', label:'cat'},
    {emoji:'🐋', label:'whale'},
    {emoji:'🦜', label:'parrot'}]},
  {ru:'Магазин', en:'magazin', correct:1, options:[
    {emoji:'💊', label:'pharmacy'},
    {emoji:'🏪', label:'shop'},
    {emoji:'📰', label:'magazine'}]},
  {ru:'Пельмени', en:'pelmeni', correct:2, options:[
    {emoji:'🥟', label:'varenyky'},
    {emoji:'🥟', label:'manty'},
    {emoji:'🥟', label:'pelmeni'}]},
  {ru:'Шуба', en:'shuba', correct:1, options:[
    {emoji:'🧣', label:'scarf'},
    {emoji:'🧥', label:'fur coat'},
    {emoji:'🧢', label:'hat'}]}
];
let roundIndex=0; let locked=false;
const progressText=document.getElementById('progressText');
const roundTitle=document.getElementById('roundTitle');
const promptRu=document.getElementById('promptRu');
const promptEn=document.getElementById('promptEn');
const cards=document.getElementById('cards');
const feedback=document.getElementById('feedback');
const roundDots=document.getElementById('roundDots');
function renderDots(){ roundDots.innerHTML=''; rounds.forEach((_,i)=>{ const d=document.createElement('div'); d.className='dot'+(i<roundIndex?' done':i===roundIndex?' current':''); roundDots.appendChild(d); }); }
function renderRound(){ const r=rounds[roundIndex]; progressText.textContent=`Round ${roundIndex+1} of ${rounds.length}`; roundTitle.textContent=`Round ${roundIndex+1}`; promptRu.textContent=r.ru; promptEn.textContent=r.en; feedback.textContent=''; cards.innerHTML=''; r.options.forEach((opt,idx)=>{ const card=document.createElement('button'); card.className='card'; card.innerHTML=`<div class="illu">${opt.emoji}</div><div class="cardTitle">${opt.label}</div>`; card.addEventListener('click',()=>choose(idx,card)); cards.appendChild(card); }); renderDots(); locked=false; }
function choose(idx,card){ if(locked) return; locked=true; const r=rounds[roundIndex]; const all=[...cards.children]; all[r.correct].classList.add('correct'); if(idx===r.correct){ feedback.textContent='Correct!'; setTimeout(()=>{ roundIndex++; if(roundIndex<rounds.length){ renderRound(); } else { showMapAfterWin(); } },700); } else { card.classList.add('wrong'); feedback.textContent='Try again!'; setTimeout(()=>{ locked=false; card.classList.remove('wrong'); feedback.textContent=''; },700); } }
function startVisa(){ miniIntro.style.display='none'; visaView.style.display='block'; roundIndex=0; renderRound(); }
document.getElementById('startVisa').addEventListener('click', startVisa);
function showMapAfterWin(){ visaView.style.display='none'; mapView.style.display='block'; document.getElementById('mapStatus').textContent='Visa Quest completed! Level 1 is green, and the knight walks to Level 2.'; setStage(0,{animate:false}); setTimeout(()=>setStage(1,{animate:true}),500); }
document.getElementById('replayVisa').addEventListener('click', ()=>{ mapView.style.display='none'; miniIntro.style.display='block'; });
</script>
<script src="knight-animation.js"></script>
</body>
</html>
